services:
  - type: web
    name: reeldata-api
    runtime: node
    plan: free
    region: singapore
    branch: fix/creator-lookup-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_SUPABASE_URL
        sync: false
      - key: APP_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_SUPABASE_SECRET_KEY
        sync: false
      - key: SESSION_SUPABASE_URL
        sync: false
      - key: SESSION_SUPABASE_SECRET_KEY
        sync: false
      - key: INSTAGRAM_SESSION_ENCRYPTION_KEY
        sync: false
