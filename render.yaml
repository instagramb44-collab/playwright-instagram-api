services:
  - type: web
    name: reeldata-api
    runtime: node
    plan: free
    region: singapore
    branch: feature/supabase-instagram-sessions
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INSTAGRAM_SESSION_ENCRYPTION_KEY
        sync: false
