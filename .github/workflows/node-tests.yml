name: Node.js tests

on:
  pull_request:
    branches:
      - fix/creator-lookup-backend
  push:
    branches:
      - optimize/chromium-memory-free

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          SKIP_PLAYWRIGHT_BROWSER_INSTALL: "1"
      - name: Run test suite
        run: npm test
