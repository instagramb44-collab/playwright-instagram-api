name: Backend tests

on:
  pull_request:
    branches:
      - feature/supabase-instagram-sessions
  push:
    branches:
      - feature/supabase-instagram-sessions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          SKIP_PLAYWRIGHT_BROWSER_INSTALL: '1'
      - run: npm test
